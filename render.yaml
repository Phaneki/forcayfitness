# Blueprint de Render para Forca & Fitness (Web Service + PostgreSQL)
# Despliegue automático desde GitHub: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: forca-fitness-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: forca-fitness-db
          property: connectionString

databases:
  - name: forca-fitness-db
    databaseName: forca_fitness
    user: forca_user
    plan: free

